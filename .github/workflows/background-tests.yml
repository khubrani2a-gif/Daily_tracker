name: Background service tests
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/background-tests.yml'
  push:
    branches: ['feat/background-calendar']
    paths:
      - 'backend/**'
      - '.github/workflows/background-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test backend/test/*.test.mjs
