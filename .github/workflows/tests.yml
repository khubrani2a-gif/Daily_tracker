name: Regression tests
on:
  pull_request:
  push:
    branches: ['fix/**']
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Qiyam reading and prayer regression
        run: node --test --test-concurrency=1 tests/qiyam-preview-v192.test.js tests/qiyam-simple-v192.test.js tests/quran-text-v191.test.js tests/quran-range-v191.test.js tests/qiyam-core-v190.test.js tests/qiyam-night-v190.test.js tests/qiyam-plan-v189.test.js tests/quran-focus-v187.test.js
        env:
          QIYAM_SCREENSHOTS_DIR: artifacts/qiyam
      - name: Qiyam visual evidence
        if: always()
        run: node -e "const f=require('fs');for(const n of ['simple-dark','simple-light','simple-reader']){const p='artifacts/qiyam/'+n+'.png';if(f.existsSync(p))console.log('QIYAM_IMAGE '+n+' '+f.readFileSync(p).toString('base64'));}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qiyam-review
          path: artifacts/qiyam
          if-no-files-found: ignore
      - run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run test:firebase
